name: проверка репозитория

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Зависимости
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Гигиена json
        run: python ops/validate_data.py

      - name: Самопроверка репозитория
        run: python ops/selfcheck.py

      - name: Тесты движка рейтинга
        working-directory: rating
        run: |
          for t in test_*.py; do
            echo "== $t"
            python "$t"
          done

      - name: Тест структурного антислопа
        run: python ops/neuroslop.py --self-test

      - name: Линтер описаний
        run: python ops/desclint.py build/decks

      - name: Стоп-лист фраз
        run: python ops/slop.py build/decks

      - name: Структурный антислоп
        run: python ops/neuroslop.py build/decks --max-score 65 --warn-score 25

      - name: Сборка дек без фотографий
        run: |
          python build/gen.py build/decks/_template.json
          python build/lint.py build/html/_template.html build/theme.css
          python build/gen.py build/decks/tm2004.json
          python build/lint.py build/html/tm2004.html build/theme.css

      - name: Эталонные кадры
        run: python refs/verify.py
