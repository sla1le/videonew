name: Temporary fetch WC covers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Download exact album covers
        shell: bash
        run: |
          cat > /tmp/fetch_covers.py <<'PY'
          import json, re
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image
          from io import BytesIO

          # Apple album IDs were checked against the exact Apple Music album pages.
          apple = {
            '02_oxxxymiron_gorgorod': 1696260685,
            '03_bbtape_aarne_peekaboo': 1752831350,
            '04_kizaru_borntotrap': 1650846344,
            '06_lsp_tragiccity': 1580604942,
            '07_pharaoh_pinkphloyd': 1257008616,
            '08_morgenshtern_pyl': 1570266761,
            '18_kasta_4glavy': 1819762773,
          }

          # Exact Deezer covers from exact artist + album matches found on the first run.
          direct = {
            '01_skryptonite_dsny': 'https://cdn-images.dzcdn.net/images/cover/827d9066758cc336485c02ae0504776b/1000x1000-000000-80-0-0.jpg',
            '05_husky_lubimye': 'https://cdn-images.dzcdn.net/images/cover/304b79f74f4bc77659a63e009bc1646e/1000x1000-000000-80-0-0.jpg',
            '17_krovostok_lombard': 'https://cdn-images.dzcdn.net/images/cover/50cc2ca12187c122921e29b61270acd0/1000x1000-000000-80-0-0.jpg',
            '19_depo_oldblood': 'https://cdn-images.dzcdn.net/images/cover/43fa21a084f850504501cb027c2816b9/1000x1000-000000-80-0-0.jpg',
            '20_slavakpss_solntse': 'https://cdn-images.dzcdn.net/images/cover/f617b64f12b38b21871e12d3e5a87a7c/1000x1000-000000-80-0-0.jpg',
            '21_gonefludd_superchuits': 'https://cdn-images.dzcdn.net/images/cover/5ec01138789306c1b405852f76d32c84/1000x1000-000000-80-0-0.jpg',
            '22_face_hatelove': 'https://cdn-images.dzcdn.net/images/cover/c8bcb2c6ed8002647316771687988c74/1000x1000-000000-80-0-0.jpg',
            '23_tfest_inostranets': 'https://cdn-images.dzcdn.net/images/cover/f1af5bb5a0ba2d8a903a9ae72972a834/1000x1000-000000-80-0-0.jpg',
            '24_markul_tranzit': 'https://cdn-images.dzcdn.net/images/cover/53bac89b1c388259f170e44d43502aee/1000x1000-000000-80-0-0.jpg',
          }

          expected = {
            '01_skryptonite_dsny': ('Скриптонит','Дом с нормальными явлениями'),
            '02_oxxxymiron_gorgorod': ('Oxxxymiron','Горгород'),
            '03_bbtape_aarne_peekaboo': ('Big Baby Tape & Aarne','PEEKABOO'),
            '04_kizaru_borntotrap': ('kizaru','BORN TO TRAP'),
            '05_husky_lubimye': ('Хаски','Любимые песни (воображаемых) людей'),
            '06_lsp_tragiccity': ('ЛСП','Tragic City'),
            '07_pharaoh_pinkphloyd': ('PHARAOH','Pink Phloyd'),
            '08_morgenshtern_pyl': ('MORGENSHTERN','Легендарная пыль'),
            '17_krovostok_lombard': ('Кровосток','Ломбард'),
            '18_kasta_4glavy': ('Каста','Четырёхглавый орёт'),
            '19_depo_oldblood': ('Boulevard Depo','OLD BLOOD'),
            '20_slavakpss_solntse': ('Слава КПСС','Солнце мёртвых'),
            '21_gonefludd_superchuits': ('GONE.Fludd','СУПЕРЧУИТС'),
            '22_face_hatelove': ('FACE','HATE LOVE'),
            '23_tfest_inostranets': ('T-Fest','Иностранец'),
            '24_markul_tranzit': ('MARKUL','Tranzit'),
          }

          out=Path('wc_covers_png'); out.mkdir(exist_ok=True)
          log=[]

          def get(url, binary=False):
              req=Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urlopen(req,timeout=40) as r:
                  data=r.read()
              return data if binary else json.loads(data.decode('utf-8','replace'))

          for key,(artist,title) in expected.items():
              if key in apple:
                  aid=apple[key]
                  data=get(f'https://itunes.apple.com/lookup?id={aid}&entity=album&country=US')
                  rows=[r for r in data.get('results',[]) if r.get('wrapperType')=='collection' or r.get('collectionType')=='Album']
                  if not rows:
                      raise SystemExit(f'Apple lookup empty: {key} id={aid}')
                  r=rows[0]
                  got_artist=r.get('artistName',''); got_title=r.get('collectionName','')
                  art=r.get('artworkUrl100')
                  if not art:
                      raise SystemExit(f'No artwork URL: {key}')
                  art=re.sub(r'/\d+x\d+bb\.(jpg|png|webp)$',r'/2000x2000bb.\1',art)
                  source=f'Apple Music album id {aid}'
              else:
                  art=direct[key]
                  got_artist=artist; got_title=title; source='Deezer exact match'

              blob=get(art, binary=True)
              im=Image.open(BytesIO(blob)).convert('RGB')
              w,h=im.size
              s=min(w,h); im=im.crop(((w-s)//2,(h-s)//2,(w-s)//2+s,(h-s)//2+s))
              if im.width < 1200:
                  im=im.resize((1200,1200),Image.Resampling.LANCZOS)
              elif im.width > 2000:
                  im=im.resize((2000,2000),Image.Resampling.LANCZOS)
              path=out/f'{key}.png'
              im.save(path,'PNG',optimize=True)
              print(key, source, got_artist, '—', got_title, im.size)
              log.append({'file':path.name,'wanted_artist':artist,'wanted_album':title,'matched_artist':got_artist,'matched_album':got_title,'source':source,'source_image_url':art,'size':list(im.size)})

          if len(list(out.glob('*.png'))) != 16:
              raise SystemExit('Expected 16 PNG files')
          (out/'SOURCES.json').write_text(json.dumps(log,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/fetch_covers.py
      - name: Upload covers
        uses: actions/upload-artifact@v4
        with:
          name: ECHORATE_WC_V1_COVERS_PNG_EXACT
          path: wc_covers_png/
          if-no-files-found: error
